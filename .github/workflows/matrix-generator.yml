name: Dynamic Matrix Generator

on:
  workflow_call:
    inputs:
      php_versions:
        required: true
        type: string
      os_versions:
        required: true
        type: string
      blueprints:
        required: true
        type: string
    outputs:
      matrix:
        value: ${{ jobs.generate.outputs.matrix }}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute Matrix Permutations
        id: set-matrix
        run: |
          DATE=$(date +'%Y%m%d')
          RUN_NUMBER="${{ github.run_number }}"
          
          USER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          # Clean 'docker-' prefix (e.g., 'docker-drupal' -> 'drupal')
          CLEAN_REPO="${REPO#docker-}"

          readarray -t PHP_ARR < <(echo '${{ inputs.php_versions }}' | jq -r '.[]')
          readarray -t OS_ARR < <(echo '${{ inputs.os_versions }}' | jq -r '.[]')

          # Identify highest values to anchor the permanent shortcut variant tags
          LATEST_PHP=$(echo '${{ inputs.php_versions }}' | jq -r '.[-1]')
          LATEST_OS=$(echo '${{ inputs.os_versions }}' | jq -r '.[-1]')
          
          FINAL_MATRIX='[]'

          for PHP in "${PHP_ARR[@]}"; do
            for OS in "${OS_ARR[@]}"; do

              BASE_ARGS='["PHP='"$PHP"'", "OS='"$OS"'", "CREATE_DATE='"$DATE"'", "VERSION=GHA-'"$RUN_NUMBER"'"]'

              ITERATION_MATRIX=$(echo '${{ inputs.blueprints }}' | jq -c \
                --argjson base "$BASE_ARGS" \
                --arg user "$USER" \
                --arg repo "$CLEAN_REPO" \
                --arg php "$PHP" \
                --arg os "$OS" \
                --arg date "$DATE" \
                --arg latest_php "$LATEST_PHP" \
                --arg latest_os "$LATEST_OS" '
                to_entries | map(
                  (.key | split("@")) as $parts
                  | $parts[0] as $folder
                  | ($parts[1] // "") as $target
                  | {
                      "context": ("./" + $folder),
                      "target": $target,
                      "build_args": (($base + .value) | join("\n"))
                    }
                  
                  # Base namespace definition (e.g., alchatti/drupal)
                  | ( $user + "/" + $repo ) as $base_tag
                  
                  # Formulate variant modifier name
                  | (if $target != "" then ($folder + "-" + $target) else $folder end) as $variant
                  
                  # 1. Primary standard track version tag
                  | .tags = ($base_tag + ":" + $php + "-" + $variant + "-" + $os)
                  
                  # 2. Add permanent feature alias tags (No numbers, No OS, No "latest" keyword)
                  | if $php == $latest_php and $os == $latest_os then 
                      .tags = .tags + "\n" + $base_tag + ":" + $variant
                    else . end
                )
              ')

              FINAL_MATRIX=$(jq -c --argjson new "$ITERATION_MATRIX" '$new + .' <<< "$FINAL_MATRIX")
            done
          done

          echo "matrix=$FINAL_MATRIX" >> "$GITHUB_OUTPUT"

      - name: Generate Run Summary
        run: |
          echo "### 🚀 Dynamic Build Matrix Summary" >> $GITHUB_STEP_SUMMARY
          echo "The dynamic matrix completed calculations. Below is the full breakdown of images scheduled to build in the next step:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Context Folder | Docker Stage Target | Registry Image & Tags |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          echo '${{ steps.set-matrix.outputs.matrix }}' | jq -r '.[] | 
            "| `\(.context)` | `\(if .target == "" then "N/A" else .target end)` | `\(.tags | split("\n") | join("` <br> `"))` |"' >> $GITHUB_STEP_SUMMARY
