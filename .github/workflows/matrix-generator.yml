name: Dynamic Matrix Generator

on:
  workflow_call:
    inputs:
      php_versions:
        required: true
        type: string
      os_versions:
        required: true
        type: string
      blueprints:
        required: true
        type: string
    outputs:
      matrix:
        value: ${{ jobs.generate.outputs.matrix }}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Compute Matrix Permutations
        id: set-matrix
        shell: bash
        env:
          PHP_VERSIONS: ${{ inputs.php_versions }}
          OS_VERSIONS: ${{ inputs.os_versions }}
          BLUEPRINTS: ${{ inputs.blueprints }}
        run: |
          set -euo pipefail

          DATE="$(date +'%Y%m%d')"
          RUN_NUMBER="${{ github.run_number }}"

          USER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          REF_NAME="${GITHUB_REF_NAME:-${{ github.ref_name }}}"

          # Clean 'docker-' prefix:
          # docker-drupal -> drupal
          CLEAN_REPO="${REPO#docker-}"

          # Add branch prefix only when branch is not main.
          # Example:
          #   main                  -> no prefix
          #   feature/test-cache    -> feature-test-cache-
          if [ "${REF_NAME}" = "main" ]; then
            BRANCH_PREFIX=""
          else
            BRANCH_SLUG="$(
              printf '%s' "${REF_NAME}" \
                | tr '[:upper:]' '[:lower:]' \
                | sed -E 's|[^a-z0-9_.-]+|-|g; s|^-+||; s|-+$||' \
                | cut -c1-40
            )"

            if [ -z "${BRANCH_SLUG}" ]; then
              BRANCH_SLUG="branch"
            fi

            BRANCH_PREFIX="${BRANCH_SLUG}-"
          fi

          readarray -t PHP_ARR < <(echo "${PHP_VERSIONS}" | jq -r '.[]')
          readarray -t OS_ARR < <(echo "${OS_VERSIONS}" | jq -r '.[]')

          # Last entry is treated as the latest/default tag anchor
          LATEST_PHP="$(echo "${PHP_VERSIONS}" | jq -r '.[-1]')"
          LATEST_OS="$(echo "${OS_VERSIONS}" | jq -r '.[-1]')"

          FINAL_MATRIX='[]'

          for PHP in "${PHP_ARR[@]}"; do
            for OS in "${OS_ARR[@]}"; do

              BASE_ARGS='["PHP='"${PHP}"'", "OS='"${OS}"'", "CREATE_DATE='"${DATE}"'", "VERSION=GHA-'"${RUN_NUMBER}"'"]'

              ITERATION_MATRIX="$(
                echo "${BLUEPRINTS}" | jq -c \
                  --argjson base "${BASE_ARGS}" \
                  --arg user "${USER}" \
                  --arg repo "${CLEAN_REPO}" \
                  --arg php "${PHP}" \
                  --arg os "${OS}" \
                  --arg latest_php "${LATEST_PHP}" \
                  --arg latest_os "${LATEST_OS}" \
                  --arg branch_prefix "${BRANCH_PREFIX}" '
                  to_entries | map(
                    .key as $blueprint_name
                    | (.key | split("@")) as $parts
                    | $parts[0] as $folder
                    | ($parts[1] // "") as $target
                    | .value as $blueprint

                    | if ($blueprint | type) != "object" then
                        error("Blueprint value for " + $blueprint_name + " must be an object")
                      else
                        .
                      end

                    | ($blueprint.build_args // []) as $extra_args
                    | ($blueprint.test_command // "") as $test_command

                    | if ($extra_args | type) != "array" then
                        error("build_args for " + $blueprint_name + " must be an array")
                      else
                        .
                      end

                    | (
                        if $target != "" then
                          ($folder + "-" + $target)
                        else
                          $folder
                        end
                      ) as $variant

                    | {
                        "context": ("./" + $folder),
                        "target": $target,
                        "variant": $variant,
                        "build_args": (($base + $extra_args) | join("\n")),
                        "test_command": $test_command,
                        "test_image_tag": ("local/" + $variant + ":test")
                      }

                    | ($user + "/" + $repo) as $base_tag

                    | .tags = ($base_tag + ":" + $branch_prefix + $php + "-" + $variant + "-" + $os)

                    | if $php == $latest_php and $os == $latest_os then
                        .tags = .tags + "\n" + $base_tag + ":" + $branch_prefix + $variant
                      else
                        .
                      end
                  )
                '
              )"

              FINAL_MATRIX="$(jq -c --argjson new "${ITERATION_MATRIX}" '. + $new' <<< "${FINAL_MATRIX}")"
            done
          done

          echo "matrix=${FINAL_MATRIX}" >> "${GITHUB_OUTPUT}"

      - name: Generate Run Summary
        shell: bash
        run: |
          set -euo pipefail

          echo "### 🚀 Dynamic Build Matrix Summary" >> "${GITHUB_STEP_SUMMARY}"
          echo "The dynamic matrix completed calculations. Below is the full breakdown of images scheduled to build in the next step:" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"

          echo "| Context Folder | Docker Stage Target | Variant | Test Enabled | Local Test Image | Registry Image & Tags |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| :--- | :--- | :--- | :--- | :--- | :--- |" >> "${GITHUB_STEP_SUMMARY}"

          echo '${{ steps.set-matrix.outputs.matrix }}' | jq -r '.[] |
            "| `\(.context)` | `\(if .target == "" then "N/A" else .target end)` | `\(.variant)` | `\(if .test_command == "" then "No" else "Yes" end)` | `\(.test_image_tag)` | `\(.tags | split("\n") | join("` <br> `"))` |"
          ' >> "${GITHUB_STEP_SUMMARY}"
