name: Build & Publish Images

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.gitignore'
      - 'LICENSE'
      - 'README*'
      - 'CODE_OF_CONDUCT*'
      - 'CONTRIBUTING*'
      - 'SECURITY*'
      - 'CHANGELOG*'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

  build-builder-versioned:
    needs: prepare
    permissions:
      contents: read
    strategy:
      matrix:
        php_ver: [ "8.4" ]
        node_ver: [ "24" ]
        os_ver: [ trixie ]
    uses: ./.github/workflows/reusable-docker-build-push.yml
    with:
      context: ./builder
      dockerfile: ./builder/Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args: |
        PHP=${{ matrix.php_ver }}
        NODE=${{ matrix.node_ver }}
        OS=${{ matrix.os_ver }}
        CREATE_DATE=${{ needs.prepare.outputs.date }}
        VERSION=GHA-${{ github.run_number }}
      tags: |
        alchatti/php-builder:p${{ matrix.php_ver }}-n${{ matrix.node_ver }}-${{ matrix.os_ver }}
        alchatti/php-builder:${{ matrix.php_ver }}-${{ needs.prepare.outputs.date }}
        alchatti/php-builder:latest
    secrets: inherit

  build-fpm-apache:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-docker-build-push.yml
    with:
      context: ./fpm-apache
      dockerfile: ./fpm-apache/Dockerfile
      platforms: linux/amd64,linux/arm64
      tags: |
        alchatti/drupal-fpm-apache:${{ needs.prepare.outputs.date }}
        alchatti/drupal-fpm-apache:latest
    secrets: inherit
