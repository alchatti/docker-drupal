name: Build & Publish Images

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.gitignore'
      - 'LICENSE'
      - 'README*'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Call the simplified dynamic matrix backend
  prepare:
    uses: alchatti/.github/.github/workflows/matrix-generator.yml@main
    with:
      php_versions: '["8.2", "8.3", "8.4"]'
      os_versions: '["bookworm", "trixie"]'
      blueprints: |
        {
          "builder": ["NODE=24"],
          "fpm-apache": []
        }

  # Job 2: Consume the generated matrix seamlessly
  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    uses: alchatti/.github/.github/workflows/docker-build-push.yml@main
    with:
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.context }}/Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args: ${{ matrix.build_args }}
      tags: ${{ matrix.tags }}
    secrets: inherit
 
