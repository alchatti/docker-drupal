name: Build & Publish Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.gitignore'
      - 'LICENSE'
      - 'README*'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    uses: AUSharjah/org-actions/.github/workflows/php-matrix.yml@rc
    with:
      php_versions: '["8.4"]'
      os_versions: '["trixie"]'
      blueprints: |
        {
          "builder": {
            "build_args": ["NODE=24"],
            "test_command": "docker run --rm \"$IMAGE\" verify-builder.sh"
          },
          "serversideup-apache-fpm": {},
          "apache": {
            "test_command": "NAME=\"apache-php-test-${IMAGE//[^a-zA-Z0-9_.-]/-}\"; docker rm -f \"$NAME\" >/dev/null 2>&1 || true; docker run -d --name \"$NAME\" -e DRUPAL_SUBDIR=/test-site -e PHP_UPLOAD_MAX_FILESIZE=128M -e PHP_POST_MAX_SIZE=129M -e PHP_MAX_EXECUTION_TIME=180 \"$IMAGE\"; cleanup() { docker logs \"$NAME\" || true; docker rm -f \"$NAME\" || true; }; trap cleanup EXIT; for i in $(seq 1 30); do if docker exec \"$NAME\" verify-apache-php.sh; then exit 0; fi; sleep 2; done; echo \"ERROR: Apache PHP verification failed after retries\" >&2; exit 1"
          },
          "apache-fpm": {
            "test_command": "NAME=\"apache-php-test-${IMAGE//[^a-zA-Z0-9_.-]/-}\"; docker rm -f \"$NAME\" >/dev/null 2>&1 || true; docker run -d --name \"$NAME\" -e DRUPAL_SUBDIR=/test-site -e PHP_UPLOAD_MAX_FILESIZE=128M -e PHP_POST_MAX_SIZE=129M -e PHP_MAX_EXECUTION_TIME=180 \"$IMAGE\"; cleanup() { docker logs \"$NAME\" || true; docker rm -f \"$NAME\" || true; }; trap cleanup EXIT; for i in $(seq 1 30); do if docker exec \"$NAME\" verify-apache-php.sh; then exit 0; fi; sleep 2; done; echo \"ERROR: Apache PHP-FPM verification failed after retries\" >&2; exit 1"
          }
        }

  build:
    needs: prepare

    strategy:
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    uses: AUSharjah/org-actions/.github/workflows/docker-cloud-build.yml@rc
    with:
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      platforms: linux/amd64,linux/arm64
      build_args: ${{ matrix.build_args }}
      tags: ${{ matrix.tags }}
      target: ${{ matrix.target }}
      test_command: ${{ matrix.test_command }}
      test_platform: linux/amd64

    secrets:
      DOCKER_PAT_GITHUB_CI: ${{ secrets.DOCKER_PAT_GITHUB_CI }}
